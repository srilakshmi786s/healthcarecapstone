<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1>Reset Password</h1>
    <p class="subtitle">Enter and confirm your new password below.</p>

    <div *ngIf="tokenMissing" class="alert alert-error">
      ⚠️ {{ errorMessage }}
      <br><br>
      <a routerLink="/auth/forgot-password">Request a new reset link →</a>
    </div>

    <form *ngIf="!tokenMissing" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="At least 6 characters"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat new password"
          class="form-control"
          [class.mismatch]="confirmPassword && newPassword !== confirmPassword"
          required
        />
        <small *ngIf="confirmPassword && newPassword !== confirmPassword" class="mismatch-hint">
          Passwords do not match
        </small>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Set New Password</span>
        <span *ngIf="loading">Updating…</span>
      </button>
    </form>

    <div *ngIf="successMessage" class="alert alert-success">
      ✅ {{ successMessage }}<br>
      <small>Redirecting to login…</small>
    </div>
    <div *ngIf="errorMessage && !tokenMissing" class="alert alert-error">
      ⚠️ {{ errorMessage }}
    </div>

    <div class="auth-links" *ngIf="!tokenMissing">
      <a routerLink="/auth/login">← Back to Login</a>
    </div>
  </div>
</div>
