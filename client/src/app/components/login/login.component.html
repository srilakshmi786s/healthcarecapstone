<div class="login-container">
    <h2>Login</h2>
    <form [formGroup]="itemForm" (ngSubmit)="onLogin()">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" formControlName="username" class="form-control">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password" class="form-control">
        </div>
        <button type="submit" [disabled]="itemForm.invalid" class="btn btn-primary">Login</button>
        <button type="button" (click)="registration()" class="btn btn-link">Register</button>
    </form>
    <div *ngIf="showError" class="alert alert-danger mt-3">
        {{ errorMessage }}
    </div>
</div>
